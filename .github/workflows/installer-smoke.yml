name: Installer upgrade acceptance
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package*.json"
      - "tests/**"
      - "playwright.config.ts"
      - "scripts/desktop.mjs"
      - "scripts/prepare-assets.mjs"
  workflow_dispatch:
    inputs:
      candidateTag:
        description: Existing release installer to validate (empty builds source)
        type: string
        default: ""
      useUpdater:
        description: Exercise stable GitHub check and signed in-app update
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: inputs.candidateTag == ''
        uses: dtolnay/rust-toolchain@stable
      - if: inputs.candidateTag == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - if: inputs.candidateTag == ''
        run: npx playwright install chromium
      - if: inputs.candidateTag == ''
        run: npx playwright test
      - name: Build disposable candidate installer
        if: inputs.candidateTag == ''
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Install beta2, seed local notes, upgrade and verify beta3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9226
          CANDIDATE_TAG: ${{ inputs.candidateTag }}
          USE_UPDATER: ${{ inputs.useUpdater }}
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP 'previous'
          gh release download v0.1.1-beta2 --pattern '*setup.exe' --dir $previousDir
          $previous = (Get-ChildItem (Join-Path $previousDir '*setup.exe')).FullName
          $install = Join-Path $env:RUNNER_TEMP 'Orvia-Acceptance'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:LOCALAPPDATA 'Orvia-Acceptance-WebView2'
          $process = Start-Process $previous -ArgumentList "/S /NS /D=$install" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "stable installer failed" }
          # Silent seeding skips the GUI installer's language page and its registry callback.
          # Match an English GUI installation before exercising the passive in-app updater.
          $languageKey = 'HKCU:/Software/zeze49024/Orvia'
          if (!(Test-Path -LiteralPath $languageKey)) { New-Item -Path $languageKey | Out-Null }
          New-ItemProperty -LiteralPath $languageKey -Name 'Installer Language' -Value '1033' -PropertyType String -Force | Out-Null
          $executable = Join-Path $install 'orvia.exe'
          $env:ORVIA_ACCEPTANCE_EXE = $executable
          if (!(Test-Path -LiteralPath $executable)) {
            Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/Orvia' -ErrorAction SilentlyContinue | Format-List
            Get-ChildItem -LiteralPath $install -ErrorAction SilentlyContinue
            throw "Installer did not create the expected executable"
          }
          $app = Start-Process $executable -PassThru -WindowStyle Hidden -RedirectStandardError native-startup.txt
          node scripts/native-smoke.mjs seed
          if ($LASTEXITCODE -ne 0) {
            Get-Content native-startup.txt -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name='orvia.exe' OR Name='msedgewebview2.exe'" | Select-Object Name,ProcessId,CommandLine | Format-List
            Get-ChildItem -LiteralPath $env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
            throw "stable seed failed"
          }
          if ($env:USE_UPDATER -eq 'true') {
            node scripts/native-smoke.mjs update
            if ($LASTEXITCODE -ne 0) { throw "Signed in-app updater failed" }
            for ($i=0; $i -lt 120; $i++) {
              if ((Get-Item $executable).VersionInfo.ProductVersion -eq '0.1.1-beta3') { break }
              Start-Sleep -Seconds 1
            }
            if ((Get-Item $executable).VersionInfo.ProductVersion -ne '0.1.1-beta3') {
              Get-Process | Where-Object { $_.MainWindowTitle -like '*Orvia*' -or $_.MainWindowTitle -like '*Installer*' } | Select-Object Id,ProcessName,MainWindowTitle
              Get-ItemProperty -LiteralPath $languageKey | Format-List
              $defaultExecutable = Join-Path $env:LOCALAPPDATA 'Orvia/orvia.exe'
              if (Test-Path -LiteralPath $defaultExecutable) { (Get-Item $defaultExecutable).VersionInfo | Select-Object FileName,ProductVersion }
              throw 'Updater did not replace executable'
            }
            # NSIS restarts via the Windows shell without our debugging environment.
            # Reopen only this disposable fixture with an explicit WebView2 profile.
            Start-Sleep -Seconds 3
            $fixtureProcesses = Get-Process -Name orvia -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $executable }
            foreach ($fixtureProcess in $fixtureProcesses) { Stop-Process -Id $fixtureProcess.Id -Force }
          } else {
            Stop-Process -Id $app.Id -Force
            if ($env:CANDIDATE_TAG) {
              $candidateDir = Join-Path $env:RUNNER_TEMP 'candidate'
              gh release download $env:CANDIDATE_TAG --pattern '*setup.exe' --dir $candidateDir
              if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
              $candidate = (Get-ChildItem (Join-Path $candidateDir '*setup.exe')).FullName
            } else {
              $candidate = (Get-ChildItem src-tauri/target/release/bundle/nsis/*setup.exe).FullName
            }
            $process = Start-Process $candidate -ArgumentList "/S /NS /UPDATE /D=$install" -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "stable installer failed" }
          }
          Start-Process $executable -WindowStyle Hidden
          node scripts/native-smoke.mjs verify
          if ($LASTEXITCODE -ne 0) { throw "stable upgrade validation failed" }
          node scripts/native-smoke.mjs crash
          if ($LASTEXITCODE -ne 0) { throw "Crash draft setup failed" }
          Get-Process -Name orvia -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $executable } | Stop-Process -Force
          Start-Process $executable -WindowStyle Hidden
          node scripts/native-smoke.mjs recover
          if ($LASTEXITCODE -ne 0) { throw "Crash recovery validation failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-acceptance
          path: |
            native-validation.json
            native-upgrade.png
            native-pdf-error.png
            native-writing.pdf
            native-startup.txt
            playwright-report/
            test-results/
